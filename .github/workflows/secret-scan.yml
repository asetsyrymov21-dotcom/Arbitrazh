name: Secret scan

on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  secrets:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject tracked environment and private key files
        shell: python
        run: |
          import pathlib, subprocess
          files = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          allowed = {".env.example", ".env.sample", ".env.template"}
          forbidden = [
              name for name in files if name and (
                  (pathlib.PurePosixPath(name).name.startswith(".env")
                   and pathlib.PurePosixPath(name).name not in allowed)
                  or pathlib.PurePosixPath(name).suffix in {".key", ".p12", ".pfx"}
              )
          ]
          if forbidden:
              raise SystemExit("Secret-bearing file names tracked: " + ", ".join(forbidden))
      - name: Install verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --retry 3 --output "$archive" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
      - name: Scan every fetched commit
        shell: bash
        run: |
          "$RUNNER_TEMP/gitleaks/gitleaks" git . --redact=100 --no-banner \
            --ignore-gitleaks-allow --log-opts="--all"
      - name: Audit inline credential-shaped literals
        shell: python
        run: |
          import pathlib, re, subprocess
          files = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          patterns = [
            ("AWS access key", re.compile(r"\b(?:AKIA|ASIA)[A-Z0-9]{16}\b")),
            ("GitHub token", re.compile(r"\b(?:gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{25,})\b")),
            ("AI API key", re.compile(r"\b(?:sk-proj-[A-Za-z0-9_-]{20,}|sk-ant-[A-Za-z0-9_-]{20,}|sk-[A-Za-z0-9_-]{42,}|AIza[0-9A-Za-z_-]{30,})\b")),
            ("Payment or chat token", re.compile(r"\b(?:sk_live_[A-Za-z0-9]{12,}|xox[baprs]-[0-9A-Za-z-]{15,}|[0-9]{7,11}:[A-Za-z0-9_-]{30,})\b")),
            ("Private key header", re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----")),
            ("Credentials in URL", re.compile(r"(?i)\b(?:postgres(?:ql)?|mysql|mongodb(?:\+srv)?|redis|amqp|https?)://[^:/\s]+:[^@\s/]+@")),
          ]
          assignment=re.compile(r'''(?i)(?<![\w])(?P<key>[A-Z0-9_]*(?:PASSWORD|PASSWD|PASSPHRASE|SECRET|API_KEY|API_SECRET|ACCESS_TOKEN|AUTH_TOKEN|BOT_TOKEN|PRIVATE_KEY|CLIENT_SECRET)[A-Z0-9_]*)\s*[:=]\s*['"]?(?P<value>[A-Za-z0-9_./:+@-]{3,})''')
          skip=re.compile(r'''(?i)^(?:\$\{|\$|%|<|\{|os\.|getenv|environ|settings|config|self\.|process\.|env\.|none|null|false|true|replace|change|your|dummy|placeholder|example|sample|mock|test|fake|insert|xxx|todo|secret)$|(?:_HERE|_EXAMPLE|_PLACEHOLDER)''')
          found=0
          for name in files:
              if not name or name.endswith((".png",".jpg",".jpeg",".gif",".webp",".ico",".pdf",".lock",".woff",".woff2",".pyc",".sqlite",".db",".zip",".gz",".map")): continue
              path=pathlib.Path(name)
              if not path.is_file() or path.stat().st_size>2500000: continue
              try: lines=path.read_text("utf-8").splitlines()
              except (UnicodeError, OSError): continue
              for no,line in enumerate(lines,1):
                  reasons=[label for label,rx in patterns if rx.search(line)]
                  m=assignment.search(line)
                  if m:
                      value=m.group("value")
                      if not skip.search(value) and not (value.startswith("http") and "://" not in value):
                          if not re.match(r"(?i)(?:token|password|secret|api_key|key|str|field|request|response|user|item|current|result|value|profile|settings|config|ctx|db|self)\b",value) or m.group("key").upper().endswith("PASSWORD"):
                              reasons.append("literal for "+m.group("key").upper())
                  if reasons:
                      found+=1
                      print(f"AUDIT_FINDING:{name}:{no}:{', '.join(dict.fromkeys(reasons))} (redacted)")
          print(f"Inline credential candidates: {found} (review false positives)")
