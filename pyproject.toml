[project]
name = "bybit-paper-arbitrage"
version = "0.1.0"
description = "Production-like paper trading bot for Bybit funding and spread arbitrage."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13.2",
  "asyncpg>=0.29.0",
  "fastapi>=0.111.0",
  "httpx>=0.27.0",
  "pydantic-settings>=2.3.4",
  "python-telegram-bot>=21.4",
  "sqlalchemy[asyncio]>=2.0.31",
  "structlog>=24.2.0",
  "uvicorn[standard]>=0.30.1",
  "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10.1",
  "pytest>=8.2.2",
  "pytest-asyncio>=0.23.7",
  "ruff>=0.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
plugins = ["sqlalchemy.ext.mypy.plugin"]
strict = true
warn_unreachable = true
